# Eskemia · CI
#
# Qué hace, en cada push y pull request:
#   1. web:     tsc (chequeo de tipos) y build de todo el workspace pnpm.
#   2. compose: valida que infra/compose/docker-compose.yml + overlay de
#               desarrollo resuelvan con .env.example (sin levantar nada).
#   3. sql:     levanta un Supabase efímero (secretos nuevos en cada corrida),
#               aplica db/migraciones y semillas, y corre los tests pgTAP de
#               db/pruebas: aislamiento A/B, RLS forzado, RPC del núcleo y los
#               tests de Compras y Recepción portados del legado.
#   4. secretos: gitleaks sobre TODO el historial de git.
# Dónde encaja: plan de ejecución, Etapas 0, 1 y 2 (monorepo pnpm; la versión de
# pnpm sale del campo packageManager del package.json raíz).
# Actions fijadas por SHA de commit; gitleaks por versión y checksum.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: tsc y build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc
        run: pnpm -r typecheck
      - name: build
        run: pnpm -r build

  compose:
    name: compose válido
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker compose config
        run: docker compose --env-file .env.example config --quiet

  sql:
    name: tests SQL (pgTAP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # crear-env.sh usa node para el par de claves de Auth.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: secretos efímeros
        run: sh infra/compose/utils/crear-env.sh
      - name: levantar base, Auth, Storage y PostgREST
        working-directory: infra/compose
        run: docker compose up -d --wait db auth rest storage
      - name: aplicar migraciones y semillas
        run: sh db/scripts/aplicar.sh
      - name: tests pgTAP
        run: sh db/scripts/pruebas.sh
      - name: logs del stack
        if: failure()
        working-directory: infra/compose
        run: docker compose logs --tail 80 db auth storage rest

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: instalar gitleaks
        run: |
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archivo}"
          echo "${GITLEAKS_SHA256}  ${archivo}" | sha256sum -c -
          tar -xzf "${archivo}" gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: escanear historial
        run: gitleaks git . --redact --verbose
